name: splitmate_expense_tracker
description: A smart expense tracking app with social login and advanced features.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase & Authentication - aligned to 3.x/5.x (free tier, no overrides)
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_app_check: ^0.3.2+10

  # Charts & Local DB
  fl_chart: ^1.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.6.0
  shimmer: ^3.0.0
  lottie: ^3.3.1
  image_picker: ^1.0.4

  # Social Login
  google_sign_in: ^6.1.1

  # State Management - Riverpod (replaces provider)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Date & Time
  intl: ^0.20.2

  # File Handling & PDF
  printing: ^5.14.2
  open_file: ^3.3.2
  permission_handler: ^12.0.1
  pdf: ^3.10.8
  path_provider: ^2.1.1
  device_info_plus: ^11.5.0

  # Sharing & Utils (kept - actively used)
  share_plus: ^11.0.0
  json_annotation: ^4.9.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/fonts/
    - assets/App icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/App icon.png"
  min_sdk_android: 21
